name: RedSun CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check Repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependecies
        run: npm ci

      - name: Check backend syntax
        run: node --check server.js

  
  frontend-checks:
    name: frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/my-app

    env:
      NEXT_PUBLIC_API_URL: http://localhost:1000/api

    steps:
      - name: Check Repo
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/my-app/backend/package-lock.json

      - name: Install Dependecies
        run: npm ci

      - name: Run ESlint
        run: npm run linit

      - name: Build frontend
        run: npm run build


      
