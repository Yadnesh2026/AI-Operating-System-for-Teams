name: RedSun CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check Repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependecies
        run: npm ci

      - name: Check backend syntax
        run: node --check server.js

  
  frontend-checks:
    name: frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/my-app

    env:
      NEXT_PUBLIC_API_URL: http://localhost:1000/api

    steps:
      - name: Check Repo
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/my-app/package-lock.json

      - name: Install Dependecies
        run: npm ci

      - name: Run ESlint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-publish:
      name: Build and Push Docker Images
      runs-on: ubuntu-latest

      needs:
        - backend-checks
        - frontend-checks

      if: github.event_name == 'push' && github.ref == 'ref/heads/main'

      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Set Up docker
          uses: docker/setup-builddx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and Push Backend
          uses: docker/build-push-action@v6
          with:
            context: ./backend
            push: true
            tags: |
              vedantv0502/redsun-backend:latest
              vedantv0502/redsun-backend:${{ github.sha }}

        - name: Build and Push Frontend
          uses: docker/build-push-action@v6
          with:
            context: ./frontend/my-app
            push: true
            build-args: |
              NEXT_PUBLIC_API_URL=http://localhost:1000/api
            tags: |
              vedantv0502/redsun-frontend:latest
              vedantv0502/redsun-frontend:${{ github.sha }}



      
