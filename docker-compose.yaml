services:
  backend:
    build: ./backend
    container_name: redsun-backend
    ports:
      - "1000:1000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/my-app
      args:
        NEXT_PUBLIC_API_URL: http://localhost:1000/api
    container_name: redsun-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:1000/api
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: redsun-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
